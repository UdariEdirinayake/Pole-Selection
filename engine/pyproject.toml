[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pole-engine"
version = "0.1.0"
description = "Pure Python calculation and evaluation engine for pole-select"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pole_engine*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
